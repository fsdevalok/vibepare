<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Chat — Vibe Pare</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>

<body class="chat-body">

  <div class="chat-container">
    <!-- HEADER -->
    <header class="chat-header">
      <div class="chat-info">
        <span class="chat-name" id="partnerName">Stranger</span>
        <span class="chat-meta" id="partnerMeta">—</span>
      </div>
      <div class="chat-actions">
        <button id="nextBtn" class="btn-small">Next</button>
        <button id="blockBtn" class="btn-small danger">Block</button>
        <button id="stopBtn" class="btn-small">Stop</button>
      </div>
    </header>

    <!-- MESSAGES -->
    <main class="chat-messages" id="messages"></main>

    <!-- TYPING -->
    <div class="typing-indicator hidden" id="typingIndicator">
      <span></span><span></span><span></span> Stranger is typing...
    </div>

    <!-- INPUT -->
    <footer class="chat-input">
      <input type="text" id="msgInput" placeholder="Type a message..." maxlength="500" autocomplete="off"
        inputmode="text" />
      <button id="sendBtn" type="button" class="btn-primary small">Send</button>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/chat.js"></script>
</body>

</html>
